
[platformio]
src_dir = main
include_dir = main
default_envs = nano-c6-prod

; ─────────────────────────────────────────────
; Common settings shared by all environments
; ─────────────────────────────────────────────
[env]
platform = https://github.com/pioarduino/platform-espressif32.git#develop
framework = arduino
board_build.mcu = esp32c6
board_build.f_cpu = 160000000L
board_build.partitions = partitions.csv
monitor_speed = 115200
upload_speed = 921600

build_flags =
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D ARDUINO_USB_MODE=1
    -D CORE_DEBUG_LEVEL=3
    -D ZIGBEE_MODE_ED
    -I .
    -std=gnu++17
    -Wall
    -Wextra
    ; --- Hardware pins (defaults, overridden per-board) ---
    -D BOOT_BUTTON_PIN=9
    ; --- RS485 settings ---
    -D RS485_BAUD=9600
    -D PULSE_COLD_PIN=10
    -D PULSE_HOT_PIN=11
    -D ADC_BATTERY_VOLTAGE_HI=3.3
    -D ADC_BATTERY_VOLTAGE_LO=2.0
    ; Fake ADC calibration placeholders. Replace after measuring the real divider.
    -D ADC_BATTERY_VOLTAGE_SCALE=2.0
    -D ADC_BATTERY_VOLTAGE_OFFSET_MV=0
    -D ADC_BATTERY_ENABLE_PIN=-1
    -D ADC_BATTERY_ENABLE_ACTIVE_LOW=0
    -D ADC_BATTERY_POWER_SETTLE_MS=20
    -D ADC_BATTERY_SAMPLES=12
    -D ADC_BATTERY_SAMPLE_DELAY_MS=2
    ; Fake battery curve placeholders for the calibrated input voltage.
    -D ADC_BATTERY_CURVE_EMPTY_MV=2000
    -D ADC_BATTERY_CURVE_LOW_MV=2350
    -D ADC_BATTERY_CURVE_MID_MV=2700
    -D ADC_BATTERY_CURVE_HIGH_MV=3050
    -D ADC_BATTERY_CURVE_FULL_MV=3300
    -D LOW_BATTERY_CRITICAL_PERCENT=5
    -D RS485_POWER_SETTLE_MS=100

    ; --- Zigbee identity ---
    -D 'MODEL_ID="C6_WATER_METER"'
    -D 'MANUFACTURER_NAME="MuseLab"'
    -D TX_POWER=20

; ─────────────────────────────────────────────
; NanoESP32-C6 — has onboard RGB NeoPixel on GPIO8
; ─────────────────────────────────────────────
[env:nano-c6-prod]
board = esp32-c6-devkitc-1
board_upload.flash_size = 8MB
board_build.flash_size = 8MB
build_flags =
    ${env.build_flags}
    -D RGB_LED_PIN=8
    -D GPIO_STATUS_LED_PIN=-1
    -D RS485_POWER_PIN=18 ; GPIO to control RS485 power
    -D RS485_RX=21
    -D RS485_TX=20
    -D RS485_EN=19
    -D ADC_BATTERY_VOLTAGE_PIN=1

[env:nano-c6-test]
board = esp32-c6-devkitc-1
board_upload.flash_size = 8MB
board_build.flash_size = 8MB
build_flags =
    ${env.build_flags}
    -D RGB_LED_PIN=8
    -D GPIO_STATUS_LED_PIN=-1
    -D RS485_POWER_PIN=18 ; GPIO to control RS485 power
    -D RS485_RX=21
    -D RS485_TX=20
    -D RS485_EN=19
    -D ADC_BATTERY_VOLTAGE_PIN=1
    -D TEST

; ─────────────────────────────────────────────
; Seeed XIAO ESP32C6 — no RGB, has regular LED (LED_BUILTIN = D10/GPIO15)
; ─────────────────────────────────────────────
[env:xiao-c6-prod]
board = seeed_xiao_esp32c6
board_upload.flash_size = 4MB
board_build.flash_size = 4MB
board_build.partitions = partitions_4mb.csv
build_flags =
    ${env.build_flags}
    -D RGB_LED_PIN=-1
    -D GPIO_STATUS_LED_PIN=15
    -D GPIO_STATUS_LED_ACTIVE_LOW=0
    -D RS485_POWER_PIN=23
    -D RS485_RX=17
    -D RS485_TX=16
    -D RS485_EN=19
    -D ADC_BATTERY_VOLTAGE_PIN=0

[env:xiao-c6-test]
extends = env:xiao-c6-prod
build_flags =
    ${env:xiao-c6-prod.build_flags}
    -D TEST
