
[platformio]
src_dir = main
include_dir = main
default_envs = xiao-c6-prod

; Common settings shared by all environments
[env]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.36/platform-espressif32.zip
framework = arduino
extra_scripts = pre:scripts/refresh_sdkconfig.py
; This firmware does not use the Arduino cloud services.
custom_component_remove =
    espressif/esp_rainmaker
    espressif/esp_insights
; pioarduino HybridCompile rebuilds ESP-IDF; these are not compiler -D flags.
custom_sdkconfig =
    CONFIG_ARDUINO_SELECTIVE_COMPILATION=y
    CONFIG_ARDUINO_SELECTIVE_SPI=n
    CONFIG_ARDUINO_SELECTIVE_Wire=n
    CONFIG_ARDUINO_SELECTIVE_ESP_SR=n
    CONFIG_ARDUINO_SELECTIVE_EEPROM=n
    CONFIG_ARDUINO_SELECTIVE_Preferences=y
    CONFIG_ARDUINO_SELECTIVE_Ticker=n
    CONFIG_ARDUINO_SELECTIVE_Update=n
    CONFIG_ARDUINO_SELECTIVE_Zigbee=y
    CONFIG_ARDUINO_SELECTIVE_FS=n
    CONFIG_ARDUINO_SELECTIVE_SD=n
    CONFIG_ARDUINO_SELECTIVE_SD_MMC=n
    CONFIG_ARDUINO_SELECTIVE_SPIFFS=n
    CONFIG_ARDUINO_SELECTIVE_FFat=n
    CONFIG_ARDUINO_SELECTIVE_LittleFS=n
    CONFIG_ARDUINO_SELECTIVE_Network=n
    CONFIG_ARDUINO_SELECTIVE_Ethernet=n
    CONFIG_ARDUINO_SELECTIVE_PPP=n
    CONFIG_ARDUINO_SELECTIVE_Hash=n
    CONFIG_ARDUINO_SELECTIVE_ArduinoOTA=n
    CONFIG_ARDUINO_SELECTIVE_AsyncUDP=n
    CONFIG_ARDUINO_SELECTIVE_DNSServer=n
    CONFIG_ARDUINO_SELECTIVE_ESPmDNS=n
    CONFIG_ARDUINO_SELECTIVE_HTTPClient=n
    CONFIG_ARDUINO_SELECTIVE_Matter=n
    CONFIG_ARDUINO_SELECTIVE_NetBIOS=n
    CONFIG_ARDUINO_SELECTIVE_WebServer=n
    CONFIG_ARDUINO_SELECTIVE_WiFi=n
    CONFIG_ARDUINO_SELECTIVE_NetworkClientSecure=n
    CONFIG_ARDUINO_SELECTIVE_WiFiProv=n
    CONFIG_ARDUINO_SELECTIVE_BLE=n
    CONFIG_ARDUINO_SELECTIVE_BluetoothSerial=n
    CONFIG_ARDUINO_SELECTIVE_SimpleBLE=n
    CONFIG_ARDUINO_SELECTIVE_RainMaker=n
    CONFIG_ARDUINO_SELECTIVE_OpenThread=n
    CONFIG_ARDUINO_SELECTIVE_Insights=n
    CONFIG_PM_ENABLE=y
    CONFIG_FREERTOS_USE_TICKLESS_IDLE=y
    CONFIG_FREERTOS_IDLE_TIME_BEFORE_SLEEP=3
    CONFIG_PM_POWER_DOWN_CPU_IN_LIGHT_SLEEP=n
    CONFIG_PM_PROFILING=y
    CONFIG_PM_LIGHT_SLEEP_CALLBACKS=y
    CONFIG_USJ_NO_AUTO_LS_ON_CONNECTION=y
board_build.mcu = esp32c6
board_build.f_cpu = 160000000L
board_build.partitions = partitions.csv
monitor_speed = 115200
upload_speed = 921600

; HybridCompile replaces libmain.a, including the lib-builder log wrapper.
; Use Arduino core log_printf directly.
build_unflags = -Wl,--wrap=log_printf

build_flags =
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D ARDUINO_USB_MODE=1
    -D CORE_DEBUG_LEVEL=3
    -D ZIGBEE_MODE_ED
    -Wl,--wrap=esp_zb_app_signal_handler
    -I .
    -std=gnu++17
    -Wall
    -Wextra
    ; Hardware pins that board environments may override.
    -D BOOT_BUTTON_PIN=9
    ; RS485 and pulse input settings.
    -D RS485_BAUD=9600
    -D PULSE_COLD_PIN=10
    -D PULSE_HOT_PIN=11
    -D ADC_BATTERY_VOLTAGE_HI=3.3
    -D ADC_BATTERY_VOLTAGE_LO=2.0
    ; Fake ADC calibration placeholders. Replace after measuring the real divider.
    -D ADC_BATTERY_VOLTAGE_SCALE=2.0
    -D ADC_BATTERY_VOLTAGE_OFFSET_MV=0
    -D ADC_BATTERY_ENABLE_PIN=-1
    -D ADC_BATTERY_ENABLE_ACTIVE_LOW=0
    -D ADC_BATTERY_POWER_SETTLE_MS=20
    -D ADC_BATTERY_SAMPLES=12
    -D ADC_BATTERY_SAMPLE_DELAY_MS=2
    -D ADC_BATTERY_PERCENT_SMOOTHING_SAMPLES=5
    ; Fake battery curve placeholders for the calibrated input voltage.
    -D ADC_BATTERY_CURVE_EMPTY_MV=2000
    -D ADC_BATTERY_CURVE_LOW_MV=2350
    -D ADC_BATTERY_CURVE_MID_MV=2700
    -D ADC_BATTERY_CURVE_HIGH_MV=3050
    -D ADC_BATTERY_CURVE_FULL_MV=3300
    -D LOW_BATTERY_CRITICAL_PERCENT=5
    -D RS485_POWER_CONTROL_ENABLED=1
    -D RS485_POWER_SETTLE_MS=100
    -D RS485_POWER_ACTIVE_LOW=0
    -D RS485_POWER_IDLE_OFF_MS=60000

    ; Zigbee identity.
    -D 'MODEL_ID="C6_WATER_METER"'
    -D 'MANUFACTURER_NAME="MuseLab"'
    -D TX_POWER=20

; NanoESP32-C6 has an onboard RGB NeoPixel on GPIO8.
[env:nano-c6-prod]
board = esp32-c6-devkitc-1
board_upload.flash_size = 8MB
board_build.flash_size = 8MB
build_flags =
    ${env.build_flags}
    -D RGB_LED_PIN=8
    -D GPIO_STATUS_LED_PIN=-1
    -D RS485_POWER_PIN=18
    -D RS485_RX=21
    -D RS485_TX=20
    -D RS485_EN=19
    -D ADC_BATTERY_VOLTAGE_PIN=1

[env:nano-c6-test]
board = esp32-c6-devkitc-1
board_upload.flash_size = 8MB
board_build.flash_size = 8MB
build_flags =
    ${env.build_flags}
    -D RGB_LED_PIN=8
    -D GPIO_STATUS_LED_PIN=-1
    -D RS485_POWER_PIN=18
    -D RS485_RX=21
    -D RS485_TX=20
    -D RS485_EN=19
    -D ADC_BATTERY_VOLTAGE_PIN=1
    -D TEST

; Seeed XIAO ESP32C6 has a GPIO status LED on GPIO15.
[env:xiao-c6-prod]
board = seeed_xiao_esp32c6
board_upload.flash_size = 4MB
board_build.flash_size = 4MB
board_build.partitions = partitions_4mb.csv
build_unflags =
    ${env.build_unflags}
    -D ADC_BATTERY_VOLTAGE_HI=3.3
    -D ADC_BATTERY_VOLTAGE_LO=2.0
    -D ADC_BATTERY_VOLTAGE_SCALE=2.0
    -D ADC_BATTERY_CURVE_EMPTY_MV=2000
    -D ADC_BATTERY_CURVE_LOW_MV=2350
    -D ADC_BATTERY_CURVE_MID_MV=2700
    -D ADC_BATTERY_CURVE_HIGH_MV=3050
    -D ADC_BATTERY_CURVE_FULL_MV=3300
    -D RS485_POWER_SETTLE_MS=100
build_flags =
    ${env.build_flags}
    -D RGB_LED_PIN=-1
    -D GPIO_STATUS_LED_PIN=15
    -D GPIO_STATUS_LED_ACTIVE_LOW=0
    -D RS485_POWER_PIN=23
    -D RS485_POWER_SETTLE_MS=500
    -D RS485_RX=17
    -D RS485_TX=16
    -D RS485_EN=-1
    -D ADC_BATTERY_VOLTAGE_PIN=0
    ; 3S Li-ion pack measured through the A0 voltage divider.
    -D ADC_BATTERY_VOLTAGE_HI=12.6
    -D ADC_BATTERY_VOLTAGE_LO=9.0
    -D ADC_BATTERY_VOLTAGE_SCALE=5.75
    -D ADC_BATTERY_CURVE_EMPTY_MV=9000
    -D ADC_BATTERY_CURVE_LOW_MV=10500
    -D ADC_BATTERY_CURVE_MID_MV=11100
    -D ADC_BATTERY_CURVE_HIGH_MV=12000
    -D ADC_BATTERY_CURVE_FULL_MV=12600

[env:xiao-c6-test]
extends = env:xiao-c6-prod
build_flags =
    ${env:xiao-c6-prod.build_flags}
    -D TEST

[env:xiao-c6-prod-rs485-power]
extends = env:xiao-c6-prod

[env:xiao-c6-test-real]
extends = env:xiao-c6-test
build_flags =
    ${env:xiao-c6-test.build_flags}
    -D TEST_REAL_METERS
    ; Replace 0 with real meter serials to test RS485 before Zigbee config writes.
    -D DEFAULT_COLD_SERIAL=0
    -D DEFAULT_HOT_SERIAL=0

[env:xiao-c6-test-real-rs485-power]
extends = env:xiao-c6-test-real
build_unflags =
    ${env:xiao-c6-prod.build_unflags}
    -D RS485_POWER_CONTROL_ENABLED=1
    -D RS485_POWER_IDLE_OFF_MS=60000
build_flags =
    ${env:xiao-c6-test-real.build_flags}
    -D RS485_POWER_CONTROL_ENABLED=1
    ; Force power cycling after every poll to verify that VCC and UART lines are released.
    -D RS485_POWER_IDLE_OFF_MS=0

[env:xiao-c6-test-real-rs485-power-disabled]
extends = env:xiao-c6-test-real-rs485-power
build_unflags =
    ${env:xiao-c6-test-real-rs485-power.build_unflags}
    -D RS485_POWER_CONTROL_ENABLED=1
    -D RS485_POWER_IDLE_OFF_MS=0
build_flags =
    ${env:xiao-c6-test-real-rs485-power.build_flags}
    -D RS485_POWER_CONTROL_ENABLED=0
    -D RS485_POWER_IDLE_OFF_MS=60000

[env:xiao-c6-rs485-bridge]
extends = env:xiao-c6-prod
build_unflags =
    ${env:xiao-c6-prod.build_unflags}
    -D CORE_DEBUG_LEVEL=3
build_flags =
    ${env:xiao-c6-prod.build_flags}
    -D CORE_DEBUG_LEVEL=0
    -D RS485_UART_BRIDGE
    -D RS485_POWER_CONTROL_ENABLED=1
    -D RS485_BRIDGE_USB_BAUD=9600
    -D RS485_BRIDGE_FRAME_GAP_US=3000
