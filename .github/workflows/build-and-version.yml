name: Firmware CI

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  metadata:
    name: Version metadata
    runs-on: ubuntu-latest

    outputs:
      version: ${{ steps.version.outputs.version }}
      release_version: ${{ steps.version.outputs.release_version }}
      base_version: ${{ steps.version.outputs.base_version }}
      major: ${{ steps.version.outputs.major }}
      minor: ${{ steps.version.outputs.minor }}
      patch: ${{ steps.version.outputs.patch }}
      git_sha: ${{ steps.version.outputs.git_sha }}
      build_timestamp: ${{ steps.version.outputs.build_timestamp }}
      build_date: ${{ steps.version.outputs.build_date }}
      changelog_section: ${{ steps.version.outputs.changelog_section }}
      is_release: ${{ steps.version.outputs.is_release }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve version and validate changelog
        id: version
        run: python scripts/generate_version.py --no-header

  converters:
    name: Check Zigbee2MQTT converters
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Check converter syntax
        run: |
          node --check water_meter_converter_en.js
          node --check water_meter_converter_ru.js

      - name: Collect converter artifacts
        run: |
          mkdir -p dist
          cp water_meter_converter_en.js dist/water_meter_converter_en.js
          cp water_meter_converter_ru.js dist/water_meter_converter_ru.js

      - name: Upload converter artifacts
        uses: actions/upload-artifact@v4
        with:
          name: zigbee2mqtt-converters
          path: dist/*
          if-no-files-found: error

  build:
    name: Build ${{ matrix.environment }}
    needs: metadata
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        environment:
          - nano-c6-prod
          - nano-c6-test
          - xiao-c6-prod
          - xiao-c6-test
          - xiao-c6-prod-rs485-power
          - xiao-c6-test-real
          - xiao-c6-test-real-rs485-power
          - xiao-c6-test-real-rs485-power-disabled
          - xiao-c6-rs485-bridge

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio/.cache
            ~/.platformio/packages
            ~/.platformio/platforms
          key: pio-${{ runner.os }}-${{ hashFiles('platformio.ini', 'requirements.txt') }}
          restore-keys: |
            pio-${{ runner.os }}-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate version header
        run: python scripts/generate_version.py --header include/version.h

      - name: Build firmware
        run: pio run -e "${{ matrix.environment }}"

      - name: Collect firmware artifacts
        run: |
          set -euo pipefail

          ENV_NAME="${{ matrix.environment }}"
          BUILD_DIR=".pio/build/${ENV_NAME}"

          mkdir -p dist
          cp "${BUILD_DIR}/firmware.bin" "dist/zigbee_water_meter_${ENV_NAME}.bin"
          cp "${BUILD_DIR}/firmware.elf" "dist/zigbee_water_meter_${ENV_NAME}.elf"

          if [[ -f "${BUILD_DIR}/firmware.factory.bin" ]]; then
            cp "${BUILD_DIR}/firmware.factory.bin" "dist/zigbee_water_meter_${ENV_NAME}.factory.bin"
          fi

      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ matrix.environment }}
          path: dist/*
          if-no-files-found: error

  release:
    name: GitHub Release
    needs: [metadata, converters, build]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download firmware artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: firmware-*
          path: release_dist
          merge-multiple: true

      - name: Download converter artifacts
        uses: actions/download-artifact@v4
        with:
          name: zigbee2mqtt-converters
          path: release_dist

      - name: Prepare release notes
        run: |
          set -euo pipefail

          VERSION="${{ needs.metadata.outputs.changelog_section }}"

          awk -v version="$VERSION" '
            $0 == "## [" version "]" || index($0, "## [" version "] - ") == 1 { capture=1; next }
            capture && /^## \[/ { exit }
            capture { print }
          ' CHANGELOG.md > release_notes.md

          if [[ ! -s release_notes.md ]]; then
            echo "No changelog content found for ${VERSION}" >&2
            exit 1
          fi

          cat > release_body.md <<EOF
          ## Firmware build

          - Version: ${{ needs.metadata.outputs.version }}
          - Commit: ${{ needs.metadata.outputs.git_sha }}
          - Build date: ${{ needs.metadata.outputs.build_date }}

          ## Changelog
          EOF

          cat release_notes.md >> release_body.md

          {
            echo
            echo "## Artifacts"
            find release_dist -maxdepth 1 -type f -printf '- `%f`\n' | sort
          } >> release_body.md

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: Release ${{ needs.metadata.outputs.version }}
          files: release_dist/*
          body_path: release_body.md
          generate_release_notes: false
          draft: false
          prerelease: ${{ contains(github.ref_name, '-rc') || contains(github.ref_name, '-beta') || contains(github.ref_name, '-alpha') }}
