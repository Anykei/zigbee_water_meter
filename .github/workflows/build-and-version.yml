name: Firmware CI

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.environment }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        environment:
          - nano-c6-prod
          - nano-c6-test
          - xiao-c6-prod
          - xiao-c6-test

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio/.cache
            ~/.platformio/packages
            ~/.platformio/platforms
          key: pio-${{ runner.os }}-${{ hashFiles('platformio.ini', 'requirements.txt') }}
          restore-keys: |
            pio-${{ runner.os }}-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate version header
        run: |
          set -euo pipefail

          SHORT_SHA="$(git rev-parse --short HEAD)"
          BUILD_TS="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"

          if [[ "${GITHUB_REF_TYPE}" == "tag" && "${GITHUB_REF_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            LATEST_TAG="$(git describe --tags --abbrev=0 --match 'v[0-9]*.[0-9]*.[0-9]*' 2>/dev/null || echo 'v0.0.0')"
            VERSION="${LATEST_TAG#v}-dev.${SHORT_SHA}"
          fi

          BASE_VERSION="${VERSION%%-*}"
          IFS='.' read -r MAJOR MINOR PATCH <<< "${BASE_VERSION}"

          mkdir -p include
          cat > include/version.h <<EOF
          // Generated by GitHub Actions. DO NOT EDIT.
          #ifndef INCLUDE_VERSION_H_
          #define INCLUDE_VERSION_H_

          #include <string_view>

          namespace firmware::version {

          inline constexpr std::string_view kFirmwareVersion = "${VERSION}";
          inline constexpr std::string_view kGitSha = "${SHORT_SHA}";
          inline constexpr std::string_view kBuildTimestamp = "${BUILD_TS}";
          inline constexpr int kMajor = ${MAJOR};
          inline constexpr int kMinor = ${MINOR};
          inline constexpr int kPatch = ${PATCH};

          }  // namespace firmware::version

          #endif  // INCLUDE_VERSION_H_
          EOF

      - name: Check Zigbee2MQTT converter syntax
        run: node --check water_meter_converter.js

      - name: Build firmware
        run: pio run -e ${{ matrix.environment }}

      - name: Collect firmware artifact
        run: |
          mkdir -p dist
          cp ".pio/build/${{ matrix.environment }}/firmware.bin" "dist/zigbee_water_meter_${{ matrix.environment }}.bin"
          cp ".pio/build/${{ matrix.environment }}/firmware.elf" "dist/zigbee_water_meter_${{ matrix.environment }}.elf"

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ matrix.environment }}
          path: dist/*
          if-no-files-found: error

  release:
    name: GitHub Release
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')

    permissions:
      contents: write

    steps:
      - name: Download firmware artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: firmware-*
          path: release_dist
          merge-multiple: true

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: Release ${{ github.ref_name }}
          files: release_dist/*
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref_name, '-rc') || contains(github.ref_name, '-beta') || contains(github.ref_name, '-alpha') }}
